<svg xmlns="http://www.w3.org/2000/svg" width="360" height="110" viewBox="0 0 360 110" role="img" aria-labelledby="title desc">
<title id="title">Blog Card</title>
<desc id="desc">Blog link card for zijie1024 profile.</desc>
<defs>
<style>
.text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
.title{fill:#f0f6fc;font-size:24px;font-weight:700}
.sub{fill:#7d8b99;font-size:14px}
.arrow{fill:#79c0ff;font-size:22px;font-weight:700}
.line{stroke:#26313d}
</style>
</defs>
<rect width="360" height="110" rx="12" fill="#0f141b"/>
<rect x="1" y="1" width="358" height="108" rx="11" fill="none" stroke="#26313d"/>
<text x="22" y="42" class="text title">Blog</text>
<text x="325" y="42" text-anchor="end" class="text arrow">↗</text>
<path d="M22 56H338" class="line"/>
<text x="22" y="82" class="text sub">notes / writing</text>
</svg>
