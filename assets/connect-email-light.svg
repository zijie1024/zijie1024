<svg xmlns="http://www.w3.org/2000/svg" width="360" height="110" viewBox="0 0 360 110" role="img" aria-labelledby="title desc">
<title id="title">Email Card</title>
<desc id="desc">Email link card for zijie1024 profile.</desc>
<defs>
<style>
.text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
.title{fill:#1f2328;font-size:24px;font-weight:700}
.sub{fill:#656d76;font-size:14px}
.arrow{fill:#0969da;font-size:22px;font-weight:700}
.line{stroke:#d0d7de}
</style>
</defs>
<rect width="360" height="110" rx="12" fill="#ffffff"/>
<rect x="1" y="1" width="358" height="108" rx="11" fill="none" stroke="#d0d7de"/>
<text x="22" y="42" class="text title">Email</text>
<text x="325" y="42" text-anchor="end" class="text arrow">↗</text>
<path d="M22 56H338" class="line"/>
<text x="22" y="82" class="text sub">get in touch</text>
</svg>
