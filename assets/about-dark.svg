<text x="28" y="84" fill="#f0f6fc" font-size="15" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace">I enjoy turning complex ideas into <tspan font-weight="600">practical software</tspan> and shaping ambiguous requirements into <tspan font-weight="600">clear, maintainable systems</tspan>.</text>
<text x="28" y="124" fill="#aeb8c2" font-size="15" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace">I value <tspan font-weight="600">thoughtful abstractions</tspan>, clear boundaries and <tspan font-weight="600">reliable execution</tspan>, and believe AI belongs in <tspan font-weight="600">software engineering</tspan>, supporting</text>
<text x="28" y="149" fill="#aeb8c2" font-size="15" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace">higher-quality software delivery rather than becoming a shortcut around engineering itself.</text>
